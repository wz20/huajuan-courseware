<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可交互课件</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#192f31;font:16px/1.55 "PingFang SC","Microsoft YaHei",sans-serif}main{width:min(1060px,92%);margin:36px auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #aab8b2;padding-bottom:12px}header b{letter-spacing:.12em;color:#226452}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #a2b1a8;background:#fff;border-radius:8px;padding:5px 14px}h1{font-size:clamp(30px,5vw,53px);line-height:1.2;letter-spacing:-.04em;margin:26px 0 8px}p{margin:0 0 14px}#stage{position:relative;width:100%;height:clamp(260px,45vw,430px);background:#0e202a;border-radius:14px;overflow:hidden;color:#f2f7f3}#stage canvas,#stage svg{display:block;width:100%;height:100%}.bar{display:grid;grid-template-columns:minmax(130px,auto) 1fr auto;gap:18px;align-items:center;margin:18px 0}input{width:100%;accent-color:#137962;min-height:38px}output{font-variant-numeric:tabular-nums;font-weight:bold}.lower{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid #bbc6bf;padding:14px 0}.lower b{display:block;font-size:14px;color:#296451;margin-bottom:6px}small{display:block;color:#4c6160}#stage button{position:absolute;top:12px;left:12px;background:#142d38;color:white;font-size:13px}.sr{position:absolute;width:1px;height:1px;overflow:hidden}button:focus-visible,input:focus-visible{outline:3px solid #ad6c22}
@media(max-width:600px){main{margin:18px auto}.lower{grid-template-columns:1fr;gap:12px}.bar{grid-template-columns:1fr auto;gap:4px}.bar input{grid-row:2;grid-column:1/-1}#stage{height:300px}}
</style><body><main><header><b>可交互课件</b><button id="reset">重新实验</button></header>
<h1></h1><p id="question"></p><div id="stage" role="group" aria-label="实验视图"></div>
<div class="bar"><label for="control"></label><input type="range" id="control"><output for="control" id="value"></output></div>
<div class="lower"><section><b>观察结果</b><span id="result" aria-live="polite"></span></section><section><b>试一试</b><span id="challenge"></span></section></div><small id="limit"></small></main>

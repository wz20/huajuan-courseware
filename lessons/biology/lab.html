<footer><details><summary>模型说明和教材依据</summary><p>以典型成熟绿色叶肉细胞为例，展示主要结构。形态、颜色、数量和比例为课堂示意，细胞器数量与位置会随细胞状态改变。各层独立放大，膜和小颗粒加厚以便投影。基粒拆层为观察操作，真实基粒中的类囊体相互紧贴。类囊体局部并列展示不同膜区中的复合体。</p><a href="https://openstax.org/books/biology-2e/pages/4-3-eukaryotic-cells">OpenStax · 真核细胞</a>　<a href="https://openstax.org/books/biology-2e/pages/8-2-the-light-dependent-reactions-of-photosynthesis">光反应</a>　<a href="https://openstax.org/books/biology-2e/pages/8-3-using-light-energy-to-make-organic-molecules">碳固定</a></details></footer></main>

<style>
*{box-sizing:border-box}body{margin:0;background:#f2f1e9;color:#263a36;font:16px/1.5 system-ui,"PingFang SC",sans-serif}main{width:min(1450px,95%);margin:20px auto}header,.top,.tools,.switches,.vals,.slide{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid #aebbb3;padding:0 0 10px;color:#406151}header b{font-size:14px}h1{font:700 clamp(32px,4vw,54px)/1.2 Georgia,"Songti SC",serif;margin:22px 0 5px}p{margin:4px 0 14px}button,select,input{font:inherit}button,select{padding:7px 12px;border:1px solid #a7b4a9;border-radius:6px;background:#faf9f1;color:inherit;cursor:pointer}button[aria-pressed=true]{color:white;background:#234c41;border-color:#234c41}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c87940}.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(235px,25%);border:1px solid #b3bcb1;border-radius:14px;overflow:hidden}.stage{position:relative;height:clamp(400px,55vh,620px);background:#e8e5d9;isolation:isolate}#view,#plan{position:absolute;inset:0}#view canvas,#plan svg{width:100%;height:100%;display:block;touch-action:none}.tools{position:absolute;left:12px;top:12px}.tools button{font-size:14px}.hint{position:absolute;bottom:7px;left:12px;right:12px;font-size:12px;pointer-events:none}.tag{position:absolute;pointer-events:none;transform:translate(-50%,-105%);font:600 12px system-ui;border-radius:4px;background:#213831e8;color:white;padding:2px 6px;white-space:nowrap}.tag.hot{background:#a34828}.tag:after{content:"";position:absolute;left:50%;top:100%;height:6px;border-left:1px solid #39453a}
aside{background:#173c34;color:#f6f4df;padding:clamp(14px,2vw,28px);display:flex;flex-direction:column;justify-content:center}aside h2{font-size:17px;margin:0 0 7px}.meter{background:#f0ead5;border:6px solid #2c5246;border-radius:15px;color:#253e33}.meter svg{display:block;width:100%;max-height:140px}.vals{margin-top:12px;gap:12px;justify-content:space-between}.vals b{font:700 clamp(20px,2.1vw,31px) ui-monospace,monospace}.vals small{display:block;color:#bbd2bf}#reason{font-size:14px;margin:16px 0 0;border-top:1px solid #557668;padding-top:10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:16px 0;border-bottom:1px solid #b0bdb1}.slide input{flex:1;accent-color:#25644e;min-width:90px}.switches{gap:6px}.switches label{font-size:13px}.switches select{padding:5px}#wireA{color:#a74125}#wireB{color:#28536c}.bottom{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding-top:12px}.bottom p{margin:0}.fine{color:#617268;font-size:12px;margin-top:12px}[hidden]{display:none!important}@media(max-width:760px){.desk,.controls{grid-template-columns:1fr}.stage{height:clamp(320px,83vw,440px)}main{width:94%;margin:12px auto}.controls{gap:10px}aside{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;padding:10px}.meter{grid-column:1;grid-row:1/4}.vals{margin:0;justify-content:start}.vals b{font-size:20px}aside h2{margin:0}.vals small,#reason{font-size:11px}#reason{margin:0;padding:4px 0}.tools button{padding:5px 8px}.hint{font-size:11px}}
</style><body><main><header><b>可交互课件 / 初中物理</b><button id="reset">复位实验</button></header><h1>滑动变阻器</h1><p>滑片向右推，小灯泡一定会变暗吗？先试一次，再换一组接线柱。</p>
<div class="desk"><section class="stage" id="stage"><div id="view"></div><div id="plan" hidden></div><div class="tools"><button id="physical" aria-pressed="true">实物台</button><button id="schematic" aria-pressed="false">原理图</button></div><span class="hint" id="hint"></span></section>
<aside><h2>回路电流</h2><div class="meter"><svg id="dial" viewBox="0 0 220 118" aria-hidden="true"></svg></div><div class="vals"><div><b id="amp"></b><small>电流 / A</small></div><div><b id="ohm"></b><small>接入阻值 / Ω</small></div></div><p id="reason" aria-live="polite"></p></aside></div>
<div class="controls"><div class="slide"><label for="pos">滑片位置</label><input id="pos" type="range" min="0" max="100" value="32"><output id="position" for="pos"></output></div><div class="switches"><label for="wireA">红线</label><select id="wireA"></select><label for="wireB">蓝线</label><select id="wireB"></select><button id="power"></button></div></div>
<div class="bottom"><b>小挑战</b><p id="task">保持红线接 C，把蓝线从 A 换到 B，再向右推滑片。电流怎样变化？</p><button id="next">换道题</button></div><p class="fine">理想模型：电源 6 V，均匀电阻丝 24 Ω，灯丝按 12 Ω 定值近似。铜色标记表示两接线柱之间选用的电阻丝。灯泡亮度示意由灯丝功率决定。</p></main>

<div class="top"><div><h1>月相观测台</h1><p>握住月球沿刻度盘转一圈，看地球上什么时候能看到满月。</p></div></div>
<article><section class="stage" id="stage" aria-label="月相仪操作区"><div class="viewport" id="view"></div><div class="diagram" id="diag" hidden></div><div class="modes"><button id="physical" aria-pressed="true">实物台</button><button id="plan" aria-pressed="false">原理图</button></div><p id="hint" class="hint">拖月球转动摇臂 · 拖空白处环视 · 滚轮缩放</p></section>
<aside><h2>地面望远镜</h2><div class="scope"><canvas width="192" height="192" id="disk" aria-label="当前月相"></canvas></div><div class="reading"><strong id="phase"></strong><span id="percent"></span></div><p class="caption">北朝上 · 可见月面的受光比例</p></aside></article>
<div class="bottom"><div class="row"><label for="angle">公转角</label><input id="angle" type="range" min="0" max="360" step="1" value="55"><output id="degrees" for="angle"></output></div><div class="toolbar"><button id="play" aria-pressed="false">演示公转</button><button id="zoomIn" aria-label="放大仪器">放大</button><button id="zoomOut" aria-label="缩小仪器">缩小</button></div></div>
<div class="presets" aria-label="转到指定位置"><button data-angle="0">朔月</button><button data-angle="90">上弦月</button><button data-angle="180">满月</button><button data-angle="270">下弦月</button></div>
<p class="task" id="detail">试一试：先到上弦月，再转到下弦月。两次都亮一半，亮的是哪一边？</p><p class="fine">黄铜灯标出太阳方向。月相按平行日光计算；仪器尺寸及距离为示意，忽略日月食。</p></main>
